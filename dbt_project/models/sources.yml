version: 2
sources:
  - name: BRONZE
    database: ADVENTUREWORKS
    schema: BRONZE
    description: "Adventure Works is a sample database provided by Microsoft that demonstrates the capabilities of SQL Server and other Microsoft data platform technologies. It contains a fictional company that sells bicycles and related products, and includes various tables and views that represent the company's sales, production, and customer data."
    tables:
      - name: calendar
        description: "The Calendar table contains a list of dates and related attributes, such as the day of the week, month, quarter, and year. It is used to support time-based analysis and reporting."
      - name: customers
        description: "The Customers table contains information about the customers of Adventure Works, including their names, addresses, and contact details. It is used to support customer relationship management and marketing analysis."
      - name: products
        description: "The Products table contains information about the products sold by Adventure Works, including their names, descriptions, prices, and categories. It is used to support product management and sales analysis."
      - name: PRODUCT_CATEGORIES
        description: "The Product Categories table contains information about the categories of products sold by Adventure Works, including their names and descriptions. It is used to support product management and sales analysis."
      - name: PRODUCT_SUBCATEGORIES
        description: "The Product Subcategories table contains information about the subcategories of products sold by Adventure Works, including their names and descriptions. It is used to support product management and sales analysis."
      - name: returns
        description: "The Returns table contains information about the products that have been returned by customers, including the reason for the return and the date of the return. It is used to support customer service and product quality analysis."
      - name: sales
        description: "The Sales table contains information about the sales transactions of Adventure Works, including the products sold, the customers who purchased them, and the dates of the transactions. It is used to support sales analysis and forecasting."  
      - name: TERRITORIES
        description: "The Territories table contains information about the sales territories of Adventure Works, including their names and descriptions. It is used to support sales analysis and forecasting."
      - name: _DLT_LOADS
        description: "The _DLT_LOADS table is a system table used by Delta Live Tables to track the progress of data loads. It contains information about the status of each load, including the start and end times, the number of records processed, and any errors encountered during the load process."
      - name: _DLT_PIPELINE_STATE
        description: "The _DLT_PIPELINE_STATE table is a system table used by Delta Live Tables to track the state of the pipeline. It contains information about the current state of the pipeline, including the last successful load, the last failed load, and any errors encountered during the load process."
      - name: _DLT_VERSION
        description: "The _DLT_VERSION table is a system table used by Delta Live Tables to track the version of the pipeline. It contains information about the current version of the pipeline, including the version number, the date and time of the last update, and any changes made to the pipeline since the last update."
  



