unit_tests:
  - name: test_fct_sales_scd2_lookup
    model: fct_sales
    overrides:
      macros:
        is_incremental: false 
    given: 
      - input: ref('stg_sqlserver__sales')
        rows:
          - {order_number: 'SO-101', order_line_item: 1, order_date_key: 20240515, product_key: 100, order_quantity: 1}
      - input: ref('dim_products')
        rows: 
          - {product_scd_key: 'hash_v1', product_key: 100, dbt_valid_from: 20240101, dbt_valid_to: 20240501}
          # Version mới có hiệu lực tại ngày mua
          - {product_scd_key: 'hash_v2', product_key: 100, dbt_valid_from: 20240501, dbt_valid_to: 99991231}
      - input: ref('stg_sqlserver__sales_cdc')
        rows: []
    expect:
      rows:
        - {order_number: 'SO-101', order_line_item: 1, product_scd_key: 'hash_v2'}

 











